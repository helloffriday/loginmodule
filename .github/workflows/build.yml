name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild inventory/inventory.csproj /p:Configuration=Release /p:Platform=AnyCPU

      - uses: actions/upload-artifact@v4
        with:
          name: Inventory-win-x64
          path: inventory/bin/Release
          if-no-files-found: error
